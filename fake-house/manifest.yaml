    kind: sensor
    area: ingresso
    device_class: battery
    unit: '%'
    initial: 91
    labels: [ignored]
  - id: sensor.porta_finestra_verandina_sonoff_acc80139a2_battery
    name: Batteria Verandina
    kind: sensor
    area: cucina
    device_class: battery
    unit: '%'
    initial: 64
    labels: [ignored]
  - id: sensor.pulsante_cancelletto_sonoff_acc800a92a_battery
    name: Batteria Pulsante Cancelletto
    kind: sensor
    area: esterno
    device_class: battery
    unit: '%'
    initial: 55
    labels: [ignored]
  - id: sensor.pulsante_cancelletto_2_sonoff_acc800a92e_battery
    name: Batteria Pulsante Cancelletto 2
    kind: sensor
    area: esterno
    device_class: battery
    unit: '%'
    initial: 12
    labels: [ignored]
  - id: sensor.valerio_battery_level
    name: Batteria Valerio
    kind: sensor
    area: null
    device_class: battery
    unit: '%'
    initial: 42
    labels: [ignored]
  - id: sensor.pixel_9_pro_battery_level
    name: Batteria Pixel 9 Pro
    kind: sensor
    area: null
    device_class: battery
    unit: '%'
    initial: 88
    labels: [ignored]
