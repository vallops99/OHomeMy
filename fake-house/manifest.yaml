# Casa Carina — fake house manifest
#
# The single source of truth for the unwired house. Every entity the real
# Casa Carina will expose is declared here once, with the Area it belongs to
# and any Labels it carries. `scripts/generate.py` turns this into Home
# Assistant packages; `scripts/apply-registry.py` assigns Area and Labels.
#
# Entity ids are taken verbatim from the existing Casa Carina Lovelace
# dashboard, so that swapping fakes for real devices is a no-op.
#
# kind:  light | switch | lock | alarm | vacuum | select | sensor |
#        binary_sensor | climate | media_player | camera | siren |
#        event | button | button_lock | input_button | external
#        (`external`: a real entity from a real integration, not a fake --
#        generate.py skips it, apply-registry.py only labels it)
# device_of: (binary_sensor only) the entity whose device this one joins.
#        YAML templates cannot join a device, so apply-registry.py builds
#        these as template helpers linked to it instead.
# area:  an area_id from HA's area registry, or null for a Singleton
# labels: see CONTEXT.md label vocabulary

areas:
  - id: ingresso
    name: Ingresso
    icon: mdi:door-sliding-open
    labels: [page:main:right]
  - id: corridoio
    # In the footer, not `right`: a footer block opens that Area's own Page
    # (#14, docs/protocol.md's worked example places exactly this Area here).
    # The same Area in `right` would be a Row instead -- the region decides
    # the shape.
    name: Corridoio
    icon: mdi:walk
    labels: [page:main:footer]
  - id: salone
    name: Soggiorno
    icon: mdi:sofa
    labels: [page:main:right]
  - id: camera_chri
    name: Cameretta
    icon: mdi:bed
    labels: [page:main:right]
  - id: esterno
    name: Esterno
    icon: mdi:garage
  - id: cucina
    name: Cucina
    icon: mdi:stove
    labels: [page:main:right]
  - id: camera
    name: Camera
    icon: mdi:bed
  - id: ufficio
    name: Ufficio
    icon: mdi:microsoft-office

labels:
  - id: main
    name: main
    icon: mdi:star
  - id: vision
    name: vision
    icon: mdi:cctv
  - id: gate
    name: gate
    icon: mdi:gate
  - id: security
    name: security
    icon: mdi:shield-home
  - id: multiroom
    name: multiroom
    icon: mdi:speaker-multiple
  - id: ignored
    name: ignored
    icon: mdi:eye-off

  # --- Placement (docs/protocol.md): `page:<page>:<region>`, one label per
  # Placement. `page:` is open-ended, so a Page exists purely because something
  # is labelled for it -- but each Label still has to exist in Home Assistant's
  # label registry before it can be assigned, so every page x region
  # combination the house uses is declared here, and only those: a registry
  # label that places nothing just clutters the picker (ADR-0008).
  - id: page:main:glance
    name: page:main:glance
    icon: mdi:eye-outline
  - id: page:main:left
    name: page:main:left
    icon: mdi:dock-left
  - id: page:main:right
    name: page:main:right
    icon: mdi:dock-right
  - id: page:main:footer
    name: page:main:footer
    icon: mdi:dock-bottom
  # A second Page, reached from the corridoio footer block (#14).
  - id: page:corridoio:right
    name: page:corridoio:right
    icon: mdi:walk
  # The Page Home Assistant opens as a Popup when someone rings (#28,
  # docs/protocol.md "Popups"): the doorbell's picture behind, the gates and
  # the intercom's door in front. Only the Regions it uses.
  - id: page:citofono:left
    name: page:citofono:left
    icon: mdi:doorbell-video
  - id: page:citofono:right
    name: page:citofono:right
    icon: mdi:doorbell-video
  # The cameras' own Page (#29): their Feeds, reached by tapping the camera
  # glance on `page:main`, which opens the Page Placing all of them in
  # `left` or `right`.
  - id: page:telecamere:right
    name: page:telecamere:right
    icon: mdi:cctv
  # Clima (#33): the thermostat, the weather and the readings. Its glance is
  # the same as `page:main`'s, so the Verdict is still there.
  - id: page:clima:glance
    name: page:clima:glance
    icon: mdi:thermostat
  - id: page:clima:left
    name: page:clima:left
    icon: mdi:thermostat
  - id: page:clima:right
    name: page:clima:right
    icon: mdi:thermostat

entities:
  # ---------------- Page Openers ----------------
  # The Topic Pages' front doors (ADR-0012): an `input_button` opens the Page
  # its object id names, so `input_button.clima` opens `page:clima`. Not
  # fakes of a device: the real house needs the same helpers. Its name and
  # icon are what the block shows. Pressing one in Home Assistant does
  # nothing.
  - id: input_button.clima
    name: Clima
    kind: input_button
    icon: mdi:thermostat
    area: null
    labels: [page:main:footer]
  - id: input_button.sicurezza
    name: Sicurezza
    kind: input_button
    icon: mdi:shield-home
    area: null
    labels: [page:main:footer]
  - id: input_button.media
    name: Media
    kind: input_button
    icon: mdi:speaker
    area: null
    labels: [page:main:footer]
  - id: input_button.servizi
    name: Servizi
    kind: input_button
    icon: mdi:washing-machine
    area: null
    labels: [page:main:footer]

  # ---------------- lights ----------------
  - id: light.luci_salone
    name: Luci Salone
    kind: light
    area: salone
    labels: [main]
    aggregate_of:
      - light.ingresso_interruttore_ing_salone_lampadario
      - light.ingresso_interruttore_ing_salone_luci_sala_2
      - light.soggiorno_luce_sala_3
      - light.soggiorno_luce_sala_4
  - id: light.ingresso_interruttore_ing_salone_lampadario
    name: Lampadario
    kind: light
    area: salone
  - id: light.ingresso_interruttore_ing_salone_luci_sala_2
    name: Luci Sala 2
    kind: light
    area: salone
  - id: light.soggiorno_luce_sala_3
    name: Luce Sala 3
    kind: light
    area: salone
  - id: light.soggiorno_luce_sala_4
    name: Luce Sala 4
    kind: light
    area: salone

  - id: light.luci_cucina
    name: Luci Cucina
    kind: light
    area: cucina
    labels: [main]
    aggregate_of:
      - light.luce_cucina
      - light.cucina_faretti_cucina
      - light.led_cucina
  - id: light.luce_cucina
    name: Luce Cucina
    kind: light
    area: cucina
  - id: light.cucina_faretti_cucina
    name: Faretti Cucina
    kind: light
    area: cucina
  - id: light.led_cucina
    name: LED Cucina
    kind: light
    area: cucina
    supports_color: true

  - id: light.ingresso_interruttore_ing_salone_luce_ingresso
    name: Luce Ingresso
    kind: light
    area: ingresso
    labels: [main]
  - id: light.luce_corridoio
    name: Luce Corridoio
    kind: light
    area: corridoio
    # Placed on corridoio's own Page, which is what the footer block above
    # opens -- docs/protocol.md's worked example, verbatim. `main` still
    # marks it as the Area's primary light.
    labels: [main, page:corridoio:right]
  - id: light.luce_camera_chri
    name: Luce Camera Chri
    kind: light
    area: camera_chri
    labels: [main]
  - id: light.esterno_luce_casetta_2
    name: Luce Casetta
    kind: light
    area: esterno
    labels: [main]

  # ---------------- gates ----------------
  - id: lock.esterno_cancello
    name: Cancello
    kind: lock
    area: esterno
    labels: [gate, main, page:main:left, page:citofono:left]
  - id: lock.esterno_cancelletto
    name: Cancelletto
    kind: lock
    area: esterno
    labels: [gate, page:main:left, page:citofono:left]

  # ---------------- doorbell & intercom (Ring) ----------------
  # Entity ids as the Ring integration names them
  # (docs/research/ring-integration.md): a doorbell is a `live_view` camera
  # and a `ding` event of type `ring`; an Intercom has no camera, and opens
  # its door with a `button`.
  - id: camera.campanello_live_view
    name: Campanello
    kind: camera
    area: esterno
    labels: [vision, page:citofono:right]
  # Fired by pressing `input_button.fake_fire_event_campanello_ding`, which
  # is what the Popup's automation triggers on.
  - id: event.campanello_ding
    name: Campanello Suono
    kind: event
    area: esterno
    device_class: doorbell
    event_types: [ring]
  - id: button.citofono_open_door
    name: Citofono Apri Porta
    kind: button
    area: ingresso
  # The panel has no `button` rendering, so the door is a gate like the
  # others: a template lock in front of the button. Not only a fake -- the
  # real house needs the same wrapper around the real button.
  - id: lock.citofono_porta
    name: Citofono
    kind: button_lock
    area: ingresso
    button: button.citofono_open_door
    labels: [gate, page:citofono:left]

  # ---------------- security ----------------
  - id: alarm_control_panel.ezviz_alarm
    name: Allarme
    kind: alarm
    area: null
    labels: [security, main, page:main:glance, page:clima:glance]
  - id: siren.telecamera_cancello_sirena
    name: Sirena Cancello
    kind: siren
    area: esterno
    labels: [security]
  - id: siren.telecamera_esterno_giardino_sirena
    name: Sirena Giardino
    kind: siren
    area: esterno
    labels: [security]

  # ---------------- cameras ----------------
  # In `glance` on `page:main`, as the motion glance, and in `right` on
  # `page:telecamere`, as Feeds (#29). Not in `left`: a 16:9 Feed does not
  # fit under the gates.
  - id: camera.telecamera_cancello
    name: Telecamera Cancello
    kind: camera
    area: esterno
    labels: [vision, page:main:glance, page:clima:glance, page:telecamere:right]
  - id: camera.telecamera_cancelletto
    name: Telecamera Cancelletto
    kind: camera
    area: esterno
    labels: [vision, page:main:glance, page:clima:glance, page:telecamere:right]
  - id: camera.telecamera_esterno_giardino
    name: Telecamera Giardino
    kind: camera
    area: esterno
    labels: [vision, page:main:glance, page:clima:glance, page:telecamere:right]

  # ---------------- climate ----------------
  # In full on `page:clima`, which makes it where the Hero on `page:main`
  # leads (#32).
  - id: climate.corridoio_termostato
    name: Termostato
    kind: climate
    area: corridoio
    labels: [main, page:main:glance, page:clima:glance, page:clima:left]
  - id: sensor.corridoio_termostato_umidita
    name: Umidita Termostato
    kind: sensor
    area: corridoio
    device_class: humidity
    unit: '%'
    initial: 47
    labels: [page:main:glance, page:clima:glance, page:clima:right]

  # ---------------- media ----------------
  - id: media_player.ovunque
    name: Ovunque
    kind: media_player
    area: null
    labels: [multiroom, main, page:main:footer]
  - id: media_player.echo_di_christian
    name: Echo di Christian
    kind: media_player
    area: camera_chri
    labels: [main]
  - id: media_player.echo_show_di_christian
    name: Echo Show di Christian
    kind: media_player
    area: salone
  - id: media_player.echo_spot_di_christian
    name: Echo Spot di Christian
    kind: media_player
    area: ingresso
    labels: [main]
  - id: media_player.echo_pop_di_christian
    name: Echo Pop di Christian
    kind: media_player
    area: corridoio
    labels: [main]
  - id: media_player.christian_s_echo_auto
    name: Echo Auto
    kind: media_player
    area: esterno
  - id: media_player.christian_s_lg_webos_2021_tv
    name: TV Salone
    kind: media_player
    area: salone

  # ---------------- vacuum ----------------
  - id: vacuum.roborock_s5_max
    name: Roborock S5 Max
    kind: vacuum
    area: salone
    labels: [main]
  - id: select.roborock_s5_max_mappa_selezionata
    name: Mappa Selezionata
    kind: select
    area: salone
    options: [Piano Terra, Primo Piano]
    initial: Piano Terra
  - id: select.roborock_s5_max_modalita_panno
    name: Modalita Panno
    kind: select
    area: salone
    options: [Off, Basso, Medio, Alto]
    initial: Medio
  - id: select.soggiorno_roborock_s5_max_cleaning_mode
    name: Modalita Pulizia
    kind: select
    area: salone
    options: [Silenzioso, Bilanciato, Turbo, Max]
    initial: Bilanciato
  - id: sensor.roborock_s5_max_batteria
    name: Batteria Roborock
    kind: sensor
    area: salone
    device_class: battery
    unit: '%'
    initial: 86
  - id: binary_sensor.roborock_s5_max_panno_attaccato
    name: Panno Attaccato
    kind: binary_sensor
    area: salone
    initial: 'on'
  - id: binary_sensor.soggiorno_roborock_s5_max_mancanza_d_acqua
    name: Mancanza Acqua
    kind: binary_sensor
    area: salone
    device_class: problem
    initial: 'off'

  # ---------------- dishwasher ----------------
  - id: binary_sensor.cucina_lavastoviglie_door_status
    name: Sportello Lavastoviglie
    kind: binary_sensor
    area: cucina
    device_class: door
    initial: 'off'
  - id: binary_sensor.cucina_lavastoviglie_salt
    name: Sale Lavastoviglie
    kind: binary_sensor
    area: cucina
    device_class: problem
    initial: 'off'
  - id: binary_sensor.cucina_lavastoviglie_rinse_aid
    name: Brillantante Lavastoviglie
    kind: binary_sensor
    area: cucina
    device_class: problem
    initial: 'on'

  # ---------------- doors & motion ----------------
  - id: binary_sensor.portone_ingresso
    name: Portone Ingresso
    kind: binary_sensor
    area: ingresso
    device_class: door
    initial: 'off'
    labels: [main]
  - id: binary_sensor.porta_verandina
    name: Porta Verandina
    kind: binary_sensor
    area: cucina
    device_class: door
    initial: 'off'
  - id: binary_sensor.telecamera_cancello_movimento
    # On the camera's own device, as a real EZVIZ camera's motion sensor
    # is: that is how a Feed finds its motion, since all three cameras
    # share `esterno` (CONTEXT.md, Derived).
    device_of: camera.telecamera_cancello
    name: Movimento Cancello
    kind: binary_sensor
    area: esterno
    device_class: motion
    initial: 'off'
  - id: binary_sensor.telecamera_cancelletto_movimento
    # On the camera's own device, as a real EZVIZ camera's motion sensor
    # is: that is how a Feed finds its motion, since all three cameras
    # share `esterno` (CONTEXT.md, Derived).
    device_of: camera.telecamera_cancelletto
    name: Movimento Cancelletto
    kind: binary_sensor
    area: esterno
    device_class: motion
    initial: 'off'
  - id: binary_sensor.telecamera_esterno_giardino_movimento
    # On the camera's own device, as a real EZVIZ camera's motion sensor
    # is: that is how a Feed finds its motion, since all three cameras
    # share `esterno` (CONTEXT.md, Derived).
    device_of: camera.telecamera_esterno_giardino
    name: Movimento Giardino
    kind: binary_sensor
    area: esterno
    device_class: motion
    initial: 'off'
  - id: binary_sensor.echo_di_christian_movimento
    name: Movimento Echo Camera
    kind: binary_sensor
    area: camera_chri
    device_class: motion
    initial: 'off'
  - id: binary_sensor.ingresso_echo_spot_di_christian_movimento
    name: Movimento Echo Ingresso
    kind: binary_sensor
    area: ingresso
    device_class: motion
    initial: 'off'

  # ---------------- power ----------------
  - id: switch.generale_quadro_sonoff_100285d3f0_1
    name: Quadro Generale
    kind: switch
    area: ingresso
  - id: sensor.generale_quadro_sonoff_100285d3f0_energy_month
    name: Energia Mensile
    kind: sensor
    area: ingresso
    device_class: energy
    unit: kWh
    initial: 143.2
    state_class: total_increasing
  - id: sensor.generale_quadro_sonoff_100285d3f0_power
    name: Potenza Attuale
    kind: sensor
    area: ingresso
    device_class: power
    unit: W
    initial: 320
    state_class: measurement
    labels: [page:main:glance, page:clima:glance]

  # ---------------- weather ----------------
  # Real in `ha-local`, from met.no: not a fake, so it is only labelled.
  - id: weather.forecast_casa
    name: Forecast Casa
    kind: external
    area: null
    labels: [main, page:clima:right]

  # An Echo's own chip temperature, not the room's. It used to carry
  # `ignored`, because it won Camera Chri's temperature scan (#8's fault,
  # found again on the room rows). A Row now reads only a `main` sensor
  # (roomTemperature.ts), so it can be Placed on `page:clima`, as the old
  # Lovelace Clima view had it, without reaching the Row.
  - id: sensor.echo_di_christian_temperatura
    name: Temperatura Echo
    kind: sensor
    area: camera_chri
    device_class: temperature
    unit: "°C"
    initial: 21.5
    labels: [page:clima:right]

  # ---------------- diagnostics (ignored) ----------------
  - id: sensor.portone_ingresso_batteria
    name: Batteria Portone
    kind: sensor
    area: ingresso
    device_class: battery
    unit: '%'
    initial: 78
    labels: [ignored]
  - id: sensor.portone_ingresso_sonoff_acc800b914_battery
