# Casa Carina — fake house manifest
#
# The single source of truth for the unwired house. Every entity the real
# Casa Carina will expose is declared here once, with the Area it belongs to.
# `scripts/generate.py` turns this into Home Assistant packages;
# `scripts/apply-registry.py` assigns each its Area.
#
# Entity ids are taken verbatim from the existing Casa Carina Lovelace
# dashboard, so that swapping fakes for real devices is a no-op.
#
# kind:  light | switch | lock | alarm | vacuum | select | sensor |
#        binary_sensor | climate | media_player | camera | siren |
#        event | button | button_lock | group | script | external
#        (`external`: a real entity from a real integration, not a fake --
#        generate.py skips it, apply-registry.py only gives it its Area)
# members: (group only) the entity ids the Group helper holds, in order.
# options: (sensor only) makes it an enum sensor, settable from HA.
#        `device_class: timestamp` makes a timestamp sensor; its
#        `initial_in_minutes` is resolved when generate.py runs.
# sets:  (script only) {entity, option}: the script moves that enum
#        entity's state to that option. Scripts get no Area.
# dimmable: (light only) false for an on/off light with no brightness.
#        Defaults to true.
# device_of: (binary_sensor only) the entity whose device this one joins.
#        YAML templates cannot join a device, so apply-registry.py builds
#        these as template helpers linked to it instead.
# area:  an area_id from HA's area registry, or null for a Singleton

areas:
  - id: ingresso
    name: Ingresso
    icon: mdi:door-sliding-open
  - id: corridoio
    name: Corridoio
    icon: mdi:walk
  - id: salone
    name: Soggiorno
    icon: mdi:sofa
  - id: camera_chri
    name: Cameretta
    icon: mdi:bed
  - id: esterno
    name: Esterno
    icon: mdi:garage
  - id: cucina
    name: Cucina
    icon: mdi:stove
  - id: camera
    name: Camera
    icon: mdi:bed
  - id: ufficio
    name: Ufficio
    icon: mdi:microsoft-office


entities:
  # ---------------- lights ----------------
  - id: light.luci_salone
    name: Luci Salone
    kind: light
    area: salone
    aggregate_of:
      - light.ingresso_interruttore_ing_salone_lampadario
      - light.ingresso_interruttore_ing_salone_luci_sala_2
      - light.soggiorno_luce_sala_3
      - light.soggiorno_luce_sala_4
  - id: light.ingresso_interruttore_ing_salone_lampadario
    name: Lampadario
    kind: light
    area: salone
  - id: light.ingresso_interruttore_ing_salone_luci_sala_2
    name: Luci Sala 2
    kind: light
    area: salone
  - id: light.soggiorno_luce_sala_3
    name: Luce Sala 3
    kind: light
    area: salone
  - id: light.soggiorno_luce_sala_4
    name: Luce Sala 4
    kind: light
    area: salone

  - id: light.luci_cucina
    name: Luci Cucina
    kind: light
    area: cucina
    aggregate_of:
      - light.luce_cucina
      - light.cucina_faretti_cucina
      - light.led_cucina
  - id: light.luce_cucina
    name: Luce Cucina
    kind: light
    area: cucina
  - id: light.cucina_faretti_cucina
    name: Faretti Cucina
    kind: light
    area: cucina
  - id: light.led_cucina
    name: LED Cucina
    kind: light
    area: cucina
    supports_color: true

  - id: light.ingresso_interruttore_ing_salone_luce_ingresso
    name: Luce Ingresso
    kind: light
    area: ingresso
  - id: light.luce_corridoio
    name: Luce Corridoio
    kind: light
    area: corridoio
  - id: light.luce_camera_chri
    name: Luce Camera Chri
    kind: light
    area: camera_chri
  - id: light.esterno_luce_casetta_2
    name: Luce Casetta
    kind: light
    # On/off only: a light that cannot be dimmed shows no slider (#37).
    dimmable: false
    area: esterno

  # ---------------- gates ----------------
  - id: lock.esterno_cancello
    name: Cancello
    kind: lock
    area: esterno
  - id: lock.esterno_cancelletto
    name: Cancelletto
    kind: lock
    area: esterno
  # A Lock group helper (ADR-0014): a titled card holding its members, and the panel never shows its own lock -- unlocking it would
  # open both gates at once. Not a fake: the real house needs the same one.
  - id: lock.accessi
    name: Accessi
    kind: group
    area: null
    members: [lock.esterno_cancello, lock.esterno_cancelletto]

  # ---------------- doorbell & intercom (Ring) ----------------
  # Entity ids as the Ring integration names them
  # (docs/research/ring-integration.md): a doorbell is a `live_view` camera
  # and a `ding` event of type `ring`; an Intercom has no camera, and opens
  # its door with a `button`.
  - id: camera.campanello_live_view
    name: Campanello
    kind: camera
    area: esterno
  # Fired by pressing `input_button.fake_fire_event_campanello_ding`, which
  # is what the Popup's automation triggers on.
  - id: event.campanello_ding
    name: Campanello Suono
    kind: event
    area: esterno
    device_class: doorbell
    event_types: [ring]
  - id: button.citofono_open_door
    name: Citofono Apri Porta
    kind: button
    area: ingresso
  # The panel has no `button` rendering, so the door is a gate like the
  # others: a template lock in front of the button. Not only a fake -- the
  # real house needs the same wrapper around the real button.
  - id: lock.citofono_porta
    name: Citofono
    kind: button_lock
    area: ingresso
    button: button.citofono_open_door

  # ---------------- security ----------------
  - id: alarm_control_panel.ezviz_alarm
    name: Allarme
    kind: alarm
    area: null
  - id: siren.telecamera_cancello_sirena
    name: Sirena Cancello
    kind: siren
    area: esterno
  - id: siren.telecamera_esterno_giardino_sirena
    name: Sirena Giardino
    kind: siren
    area: esterno

  # ---------------- cameras ----------------
  - id: camera.telecamera_cancello
    name: Telecamera Cancello
    kind: camera
    area: esterno
  - id: camera.telecamera_cancelletto
    name: Telecamera Cancelletto
    kind: camera
    area: esterno
  - id: camera.telecamera_esterno_giardino
    name: Telecamera Giardino
    kind: camera
    area: esterno

  # ---------------- climate ----------------
  - id: climate.corridoio_termostato
    name: Termostato
    kind: climate
    area: corridoio
  - id: sensor.corridoio_termostato_umidita
    name: Umidita Termostato
    kind: sensor
    area: corridoio
    device_class: humidity
    unit: '%'
    initial: 47

  # ---------------- media ----------------
  - id: media_player.ovunque
    name: Ovunque
    kind: media_player
    area: null
  - id: media_player.echo_di_christian
    name: Echo di Christian
    kind: media_player
    area: camera_chri
  - id: media_player.echo_show_di_christian
    name: Echo Show di Christian
    kind: media_player
    area: salone
  - id: media_player.echo_spot_di_christian
    name: Echo Spot di Christian
    kind: media_player
    area: ingresso
  - id: media_player.echo_pop_di_christian
    name: Echo Pop di Christian
    kind: media_player
    area: corridoio
  - id: media_player.christian_s_echo_auto
    name: Echo Auto
    kind: media_player
    area: esterno
  - id: media_player.christian_s_lg_webos_2021_tv
    name: TV Salone
    kind: media_player
    area: salone

  # ---------------- vacuum ----------------
  - id: vacuum.roborock_s5_max
    name: Roborock S5 Max
    kind: vacuum
    area: salone
  - id: select.roborock_s5_max_mappa_selezionata
    name: Mappa Selezionata
    kind: select
    area: salone
    options: [Piano Terra, Primo Piano]
    initial: Piano Terra
  - id: select.roborock_s5_max_modalita_panno
    name: Modalita Panno
    kind: select
    area: salone
    # Quoted: a bare `Off` is YAML's boolean, and the select offered "False".
    options: ['Off', Basso, Medio, Alto]
    initial: Medio
  - id: select.soggiorno_roborock_s5_max_cleaning_mode
    name: Modalita Pulizia
    kind: select
    area: salone
    options: [Silenzioso, Bilanciato, Turbo, Max]
    initial: Bilanciato
  - id: sensor.roborock_s5_max_batteria
    name: Batteria Roborock
    kind: sensor
    area: salone
    device_class: battery
    unit: '%'
    initial: 86
  - id: binary_sensor.roborock_s5_max_panno_attaccato
    name: Panno Attaccato
    kind: binary_sensor
    area: salone
    initial: 'on'
  - id: binary_sensor.soggiorno_roborock_s5_max_mancanza_d_acqua
    name: Mancanza Acqua
    kind: binary_sensor
    area: salone
    device_class: problem
    initial: 'off'

  # ---------------- dishwasher (Home Connect shaped) ----------------
  - id: sensor.cucina_lavastoviglie_operation_state
    name: Stato Lavastoviglie
    kind: sensor
    area: cucina
    options: [inactive, ready, delayedstart, run, pause, actionrequired, finished, error, aborting]
    initial: run
  - id: sensor.cucina_lavastoviglie_program_finish_time
    name: Fine Programma Lavastoviglie
    kind: sensor
    area: cucina
    device_class: timestamp
    initial_in_minutes: 95
  - id: sensor.cucina_lavastoviglie_program_progress
    name: Avanzamento Lavastoviglie
    kind: sensor
    area: cucina
    unit: '%'
    initial: 40
  - id: sensor.cucina_lavastoviglie_door
    name: Sportello Lavastoviglie
    kind: sensor
    area: cucina
    options: [closed, locked, open]
    initial: closed
  - id: sensor.cucina_lavastoviglie_salt_nearly_empty
    name: Sale Lavastoviglie
    kind: sensor
    area: cucina
    options: [off, present, confirmed]
    initial: 'off'
  - id: sensor.cucina_lavastoviglie_rinse_aid_nearly_empty
    name: Brillantante Lavastoviglie
    kind: sensor
    area: cucina
    options: [off, present, confirmed]
    initial: present
  - id: binary_sensor.cucina_lavastoviglie_remote_start
    name: Avvio Remoto Lavastoviglie
    kind: binary_sensor
    area: cucina
    initial: 'on'
  - id: button.cucina_lavastoviglie_stop_program
    name: Ferma Lavastoviglie
    kind: button
    area: cucina
  - id: button.cucina_lavastoviglie_resume_program
    name: Riprendi Lavastoviglie
    kind: button
    area: cucina
  - id: script.cucina_lavastoviglie_avvia
    name: Avvia Lavastoviglie
    kind: script
    area: null
    sets:
      entity: sensor.cucina_lavastoviglie_operation_state
      option: run

  # ---------------- doors & motion ----------------
  - id: binary_sensor.portone_ingresso
    name: Portone Ingresso
    kind: binary_sensor
    area: ingresso
    device_class: door
    initial: 'off'
  - id: binary_sensor.porta_verandina
    name: Porta Verandina
    kind: binary_sensor
    area: cucina
    device_class: door
    initial: 'off'
  - id: binary_sensor.telecamera_cancello_movimento
    # On the camera's own device, as a real EZVIZ camera's motion sensor
    # is: that is how a Feed finds its motion, since all three cameras
    # share `esterno` (CONTEXT.md, Derived).
    device_of: camera.telecamera_cancello
    name: Movimento Cancello
    kind: binary_sensor
    area: esterno
    device_class: motion
    initial: 'off'
  - id: binary_sensor.telecamera_cancelletto_movimento
    # On the camera's own device, as a real EZVIZ camera's motion sensor
    # is: that is how a Feed finds its motion, since all three cameras
    # share `esterno` (CONTEXT.md, Derived).
    device_of: camera.telecamera_cancelletto
    name: Movimento Cancelletto
    kind: binary_sensor
    area: esterno
    device_class: motion
    initial: 'off'
  - id: binary_sensor.telecamera_esterno_giardino_movimento
    # On the camera's own device, as a real EZVIZ camera's motion sensor
    # is: that is how a Feed finds its motion, since all three cameras
    # share `esterno` (CONTEXT.md, Derived).
    device_of: camera.telecamera_esterno_giardino
    name: Movimento Giardino
    kind: binary_sensor
    area: esterno
    device_class: motion
    initial: 'off'
  - id: binary_sensor.echo_di_christian_movimento
    name: Movimento Echo Camera
    kind: binary_sensor
    area: camera_chri
    device_class: motion
    initial: 'off'
  - id: binary_sensor.ingresso_echo_spot_di_christian_movimento
    name: Movimento Echo Ingresso
    kind: binary_sensor
    area: ingresso
    device_class: motion
    initial: 'off'

  # ---------------- power ----------------
  - id: switch.generale_quadro_sonoff_100285d3f0_1
    name: Quadro Generale
    kind: switch
    area: ingresso
  - id: sensor.generale_quadro_sonoff_100285d3f0_energy_month
    name: Energia Mensile
    kind: sensor
    area: ingresso
    device_class: energy
    unit: kWh
    initial: 143.2
    state_class: total_increasing
  - id: sensor.generale_quadro_sonoff_100285d3f0_power
    name: Potenza Attuale
    kind: sensor
    area: ingresso
    device_class: power
    unit: W
    initial: 320
    state_class: measurement

  # ---------------- weather ----------------
  # Real in `ha-local`, from met.no: not a fake, so it is only given its Area.
  - id: weather.forecast_casa
    name: Forecast Casa
    kind: external
    area: null

  # An Echo's own chip temperature, not the room's: a Widget reads it only
  # if one names it.
  - id: sensor.echo_di_christian_temperatura
    name: Temperatura Echo
    kind: sensor
    area: camera_chri
    device_class: temperature
    unit: "°C"
    initial: 21.5

  # ---------------- diagnostics ----------------
  - id: sensor.portone_ingresso_batteria
    name: Batteria Portone
    kind: sensor
    area: ingresso
    device_class: battery
    unit: '%'
    initial: 78
  - id: sensor.portone_ingresso_sonoff_acc800b914_battery
    name: Batteria Portone Sonoff
    kind: sensor
    area: ingresso
    device_class: battery
    unit: '%'
    initial: 91
  - id: sensor.porta_finestra_verandina_sonoff_acc80139a2_battery
    name: Batteria Verandina
    kind: sensor
    area: cucina
    device_class: battery
    unit: '%'
    initial: 64
  - id: sensor.pulsante_cancelletto_sonoff_acc800a92a_battery
    name: Batteria Pulsante Cancelletto
    kind: sensor
    area: esterno
    device_class: battery
    unit: '%'
    initial: 55
  - id: sensor.pulsante_cancelletto_2_sonoff_acc800a92e_battery
    name: Batteria Pulsante Cancelletto 2
    kind: sensor
    area: esterno
    device_class: battery
    unit: '%'
    initial: 12
  - id: sensor.valerio_battery_level
    name: Batteria Valerio
    kind: sensor
    area: null
    device_class: battery
    unit: '%'
    initial: 42
  - id: sensor.pixel_9_pro_battery_level
    name: Batteria Pixel 9 Pro
    kind: sensor
    area: null
    device_class: battery
    unit: '%'
    initial: 88
